[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solardoctor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []   # runtime deps in requirements_platform.txt

[tool.setuptools.package-dir]
# Package "solardoctor" lives in backend/solardoctor. The backend/ parent directory
# (instead of Axalon's old platform/) no longer shadows the stdlib `platform` module.
"solardoctor" = "backend/solardoctor"
"ml" = "ml"

[tool.setuptools]
# packages.find cannot discover 'axalon*' because the disk dir is named 'platform/', not 'axalon/'
# Explicit list required when package-dir renames a directory. Setuptools infers sub-package
# paths from the root mapping ("solardoctor" = "backend/solardoctor"), so solardoctor.core → platform/core/ works.
packages = [
    "solardoctor",
    "solardoctor.api",
    "solardoctor.core",
    "solardoctor.db",
    "solardoctor.park",
    "solardoctor.physics",
    "solardoctor.physics.schemas",
    "solardoctor.pipeline",
    "solardoctor.reporting",
    "ml",
    "ml.thermal.src",
    "ml.forecast",
    "ml.forecast.features",
    "ml.forecast.models",
    "ml.forecast.postprocessing",
    "ml.forecast.serving",
    "ml.forecast.training",
    "drone",
    "drone.relay",
    "drone.common",
    "drone.agent",
]

[tool.pytest.ini_options]
# importlib mode prevents platform/ dir from shadowing stdlib 'platform' module
# Always run tests with: PYTHONSAFEPATH=1 python -m pytest
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legacy", "frontend", "ml/thermal/notebooks", ".claude"]

[tool.ruff.lint]
# Conservative gate inherited from a codebase that was never linted: real bugs only
# (syntax errors, undefined names, bad comparisons). Tighten as modules are cleaned up.
select = ["E9", "F63", "F7", "F82"]
ignore = []


[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
