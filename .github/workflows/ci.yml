name: CI

on:
  push:
    branches: [main, 'claude/**', 'feat/**']
  pull_request:
    branches: [main]

# Least privilege for every job; the security job adds what gitleaks needs.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the stale run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONSAFEPATH: "1"
  ENABLE_THERMAL: "false"

jobs:
  backend:
    name: backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements_platform.txt
            ml/thermal/requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements_platform.txt -r ml/thermal/requirements.txt -r requirements-dev.txt -e .
      - name: ruff
        run: ruff check backend tests scripts drone ml
      - name: mypy (new modules only)
        run: |
          mods=""
          for d in physics vision fusion roi workers; do [ -d "backend/solardoctor/$d" ] && mods="$mods backend/solardoctor/$d"; done
          # shellcheck disable=SC2086
          if [ -n "$mods" ]; then mypy $mods; else echo "no new modules yet"; fi
      - name: Try to fetch thermal weights from Hugging Face
        id: weights
        continue-on-error: true
        run: python -m pip install -q huggingface_hub && python scripts/fetch_weights.py
      - name: pytest (prints any deselected weights-dependent tests)
        run: |
          # No weights -> scripts/pytest_deselect_args.sh lists the deselected tests loudly (stderr) and
          # prints the --deselect args; a CI warning annotation is added as well.
          if [ ! -s ml/thermal/checkpoints/best.pt ]; then
            echo "::warning title=Weights tests deselected::thermal weights unavailable; tests in tests/weights_required.txt are NOT run"
          fi
          deselect="$(bash scripts/pytest_deselect_args.sh)"
          # shellcheck disable=SC2086
          python -m pytest tests/backend -ra --strict-markers $deselect
      - name: Drone agent + relay tests
        run: |
          python -m pip install -r drone/requirements.txt
          python -m pytest drone/tests -ra
      - name: Root-level platform tests
        run: python -m pytest tests/test_api.py tests/test_db.py tests/test_imports.py tests/test_orchestrator.py -ra

  migrations:
    name: alembic up/down (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: sd }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: requirements_platform.txt }
      - run: python -m pip install -r requirements_platform.txt -e .
      - name: upgrade -> downgrade -> upgrade
        env:
          SOLARDOCTOR_DB_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg2://postgres:pw@localhost:5432/sd' || 'sqlite:///./ci.db' }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: frontend (lint, tsc, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build

  legacy-site:
    name: legacy axalon site unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: legacy/axalon-nextjs/package-lock.json
      - run: cd legacy/axalon-nextjs && npm ci && npm test

  smoke:
    name: playwright smoke (api + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    env:
      SOLARDOCTOR_AUTH_MODE: users
      SOLARDOCTOR_DB_URL: sqlite:///./smoke.db
      SMOKE_API_URL: http://localhost:8000
      SMOKE_BASE_URL: http://localhost:3000
      SMOKE_EMAIL: admin@solardoctor.example
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements_platform.txt
            ml/thermal/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install backend
        run: python -m pip install -r requirements_platform.txt -r ml/thermal/requirements.txt -e .
      - name: Generate a throwaway admin password (never stored)
        run: |
          pw="Ci-$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          {
            echo "SOLARDOCTOR_SEED_ADMIN_PASSWORD=$pw"
            echo "SOLARDOCTOR_SEED_TECH_PASSWORD=Ci-$(openssl rand -hex 16)"
            echo "SMOKE_PASSWORD=$pw"
          } >> "$GITHUB_ENV"
      - name: Migrate + seed SQLite (offline, SIMULATED data)
        run: |
          alembic upgrade head
          python scripts/seed.py --offline
      - name: Start API (users auth mode)
        run: |
          mkdir -p logs
          (cd /tmp && nohup python -m uvicorn solardoctor.api.app:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/logs/api.log" 2>&1 &)
      - name: Install frontend, browsers; build
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Start frontend
        working-directory: frontend
        run: nohup npm run start -- -p 3000 > "$GITHUB_WORKSPACE/logs/web.log" 2>&1 &
      - name: Wait for API and frontend (fail if not up)
        run: |
          for i in $(seq 1 40); do
            if curl -fsS localhost:8000/api/v1/health >/dev/null && curl -fsS localhost:3000 >/dev/null; then echo "up after $i tries"; exit 0; fi
            sleep 3
          done
          echo "::error::API and/or frontend did not come up in 120 s"; tail -n 50 logs/api.log logs/web.log; exit 1
      - name: Smoke tests (fails, never skips, if the script is missing)
        working-directory: frontend
        run: npm run test:smoke
      - name: Upload logs and Playwright output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            logs/
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: secret scan + dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists PR commits
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: pip-audit (report-only until baseline is clean)
        continue-on-error: true
        run: python -m pip install pip-audit && pip-audit -r requirements_platform.txt
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: npm audit --omit=dev (report-only until baseline is clean)
        continue-on-error: true
        run: |
          for d in frontend legacy/axalon-nextjs; do [ -f $d/package-lock.json ] && (cd $d && npm audit --omit=dev); done
