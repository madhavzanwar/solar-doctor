apiVersion: apps/v1
kind: Deployment
metadata:
  name: solardoctor-mqtt
  namespace: solardoctor
  labels:
    app.kubernetes.io/name: solardoctor-mqtt
    app.kubernetes.io/component: telemetry-broker
    app.kubernetes.io/part-of: solardoctor-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: solardoctor-mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solardoctor-mqtt
        app.kubernetes.io/component: telemetry-broker
        app.kubernetes.io/part-of: solardoctor-platform
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
            - name: ws
              containerPort: 9001
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: solardoctor-mqtt
  namespace: solardoctor
  labels:
    app.kubernetes.io/name: solardoctor-mqtt
    app.kubernetes.io/component: telemetry-broker
    app.kubernetes.io/part-of: solardoctor-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: solardoctor-mqtt
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      protocol: TCP
    - name: ws
      port: 9001
      targetPort: 9001
      protocol: TCP
