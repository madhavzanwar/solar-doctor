apiVersion: apps/v1
kind: Deployment
metadata:
  name: solardoctor-frontend
  namespace: solardoctor
  labels:
    app.kubernetes.io/name: solardoctor-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: solardoctor-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: solardoctor-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solardoctor-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: solardoctor-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: solardoctor-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: solardoctor-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: solardoctor-frontend
  namespace: solardoctor
  labels:
    app.kubernetes.io/name: solardoctor-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: solardoctor-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: solardoctor-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
