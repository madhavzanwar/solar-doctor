apiVersion: v1
kind: Secret
metadata:
  name: solardoctor-secrets
  namespace: solardoctor
  labels:
    app.kubernetes.io/name: solardoctor
    app.kubernetes.io/part-of: solardoctor-platform
type: Opaque
stringData:
  # In production, replace with sealed secrets, ExternalSecrets (Vault/AWS/GCP), or CI injection
  SOLARDOCTOR_API_KEY: "change-me-to-production-enterprise-api-key"
  SOLARDOCTOR_DB_URL: "postgresql+psycopg2://solardoctor:change-me-password@postgres-service.database.svc.cluster.local:5432/solardoctor"
  SOLARDOCTOR_JWT_SECRET: "change-me-to-secure-jwt-signing-key-production"
