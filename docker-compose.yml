services:
  api:
    image: axalon-api:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - axalon_data:/app/data
      - ./ml/checkpoints:/app/ml/checkpoints:ro
    environment:
      - SOLARDOCTOR_DB_URL=sqlite:////app/data/solardoctor.db
      - SOLARDOCTOR_API_KEY=${SOLARDOCTOR_API_KEY:-}
      - SOLARDOCTOR_OUTPUT_DIR=/app/data/output
      - SOLARDOCTOR_RESULTS_TTL_HOURS=${SOLARDOCTOR_RESULTS_TTL_HOURS:-0}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs:
    image: axalon-nextjs:local
    build:
      context: .
      dockerfile: Dockerfile.nextjs
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SOLARDOCTOR_API_URL=${NEXT_PUBLIC_SOLARDOCTOR_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  axalon_data:
