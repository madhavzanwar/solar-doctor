# ==============================================================================
# Eclipse Mosquitto Configuration — SolarDoctor Industrial Edge Telemetry
# ==============================================================================

# Enable persistence for industrial telemetry messages across restarts
persistence true
persistence_location /mosquitto/data/

# Structured logging to stdout for container logging and file for audit
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Standard TCP listener for industrial dataloggers (Advantech, Teltonika, Raspberry Pi)
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket listener for browser-based SCADA & real-time telemetry streaming
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
